<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Instructional Design Class Timer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --barry-red: #C5122F;
      --card-bg: rgba(0, 0, 0, 0.2);
      --card-border: rgba(255, 255, 255, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background-color: var(--barry-red);
      color: #ffffff;
    }

    .timer-app {
      max-width: 640px;
      width: 100%;
      padding: 24px 28px 28px;
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
    }

    .timer-header {
      margin-bottom: 12px;
    }

    .timer-header h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: 0.02em;
    }

    .timer-header p {
      margin: 6px 0 0;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0 18px;
    }

    .time-button {
      flex: 1 1 calc(33.33% - 8px);
      min-width: 110px;
      padding: 10px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      background: rgba(0, 0, 0, 0.18);
      color: #ffffff;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.1s ease, border-color 0.1s ease;
    }

    .time-button:hover {
      background: rgba(0, 0, 0, 0.32);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.5);
      transform: translateY(-1px);
    }

    .time-button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .time-button.active {
      background: #ffffff;
      color: var(--barry-red);
      border-color: #ffffff;
    }

    .display {
      text-align: center;
      margin: 10px 0 18px;
    }

    .time-readout {
      font-size: 3.6rem;
      line-height: 1.1;
      font-weight: 600;
      letter-spacing: 0.08em;
      margin: 0;
    }

    .status-text {
      margin-top: 8px;
      font-size: 0.95rem;
      opacity: 0.9;
      min-height: 1.2em;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 16px;
    }

    .control-button {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      background: transparent;
      color: #ffffff;
      font-size: 0.9rem;
      cursor: pointer;
      transition: background 0.1s ease, transform 0.1s ease, box-shadow 0.1s ease;
    }

    .control-button:hover {
      background: rgba(0, 0, 0, 0.25);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.4);
      transform: translateY(-1px);
    }

    .control-button:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .end-image-wrapper {
      text-align: center;
      margin-top: 10px;
    }

    .end-image-wrapper img {
      max-width: 100%;
      max-height: 240px;
      border-radius: 12px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
      display: none;
    }

    .note {
      margin-top: 10px;
      font-size: 0.8rem;
      opacity: 0.85;
      text-align: center;
    }

    @media (max-width: 520px) {
      .timer-app {
        padding: 18px 16px 20px;
        border-radius: 12px;
      }

      .time-readout {
        font-size: 2.8rem;
      }

      .time-button {
        flex: 1 1 calc(50% - 8px);
      }
    }
  </style>
</head>
<body>
  <div class="timer-app">
    <header class="timer-header">
      <h1>Instructional Design Class Timer</h1>
      <p>Select a time below. The session image and music will appear when time is up.</p>
    </header>

    <div class="button-group">
      <button class="time-button" data-seconds="3600">60 minutes</button>
      <button class="time-button" data-seconds="2700">45 minutes</button>
      <button class="time-button" data-seconds="1800">30 minutes</button>
      <button class="time-button" data-seconds="1200">20 minutes</button>
      <button class="time-button" data-seconds="900">15 minutes</button>
      <button class="time-button" data-seconds="600">10 minutes</button>
      <button class="time-button" data-seconds="300">5 minutes</button>
      <button class="time-button" data-seconds="60">1 minute</button>
      <button class="time-button" data-seconds="30">30 seconds</button>
      <button class="time-button" data-seconds="5">5 seconds (test)</button>
    </div>

    <div class="display">
      <p id="time-readout" class="time-readout">00:00</p>
      <p id="status-text" class="status-text"></p>
    </div>

    <div class="controls">
      <button id="pause-button" class="control-button" disabled>Pause</button>
      <button id="reset-button" class="control-button" disabled>Reset</button>
    </div>

    <div class="end-image-wrapper">
      <img
        id="end-image"
        alt="Cool eLearning group illustration"
        src="https://raw.githubusercontent.com/drwildermuth/timer/bb7485d72159b3585b0b4385c513d7c23205e581/Cool%20Elearning%20Group%20Image%20Generated%20by%20AI.png"
      />
    </div>

    <p class="note">Tip: Use the 5-second option to test that the image and music are working.</p>

    <audio
      id="alarm-sound"
      preload="auto"
      src="https://raw.githubusercontent.com/drwildermuth/timer/db2d4bbd2e052bf5525bf0790e90002113e97a0b/relaxing-guitar-loop-v5-245859.mp3"
    ></audio>
  </div>

  <script>
    (function () {
      const buttons = document.querySelectorAll('.time-button');
      const timeReadout = document.getElementById('time-readout');
      const statusText = document.getElementById('status-text');
      const endImage = document.getElementById('end-image');
      const alarmSound = document.getElementById('alarm-sound');

      const pauseButton = document.getElementById('pause-button');
      const resetButton = document.getElementById('reset-button');

      let timerId = null;
      let remainingSeconds = 0;
      let isPaused = false;

      function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
      }

      function clearActiveButtons() {
        buttons.forEach((btn) => btn.classList.remove('active'));
      }

      function stopTimerInternal() {
        if (timerId !== null) {
          clearInterval(timerId);
          timerId = null;
        }
      }

      function resetVisuals() {
        endImage.style.display = 'none';
        alarmSound.pause();
        alarmSound.currentTime = 0;
      }

      function startTimer(seconds) {
        stopTimerInternal();
        resetVisuals();
        remainingSeconds = seconds;
        isPaused = false;

        timeReadout.textContent = formatTime(remainingSeconds);
        statusText.textContent = 'Timer running...';
        pauseButton.textContent = 'Pause';
        pauseButton.disabled = false;
        resetButton.disabled = false;

        timerId = setInterval(() => {
          if (!isPaused) {
            remainingSeconds -= 1;
            if (remainingSeconds <= 0) {
              remainingSeconds = 0;
              timeReadout.textContent = '00:00';
              statusText.textContent = "Time's up!";
              stopTimerInternal();

              endImage.style.display = 'block';

              // Try to play the sound (may require user interaction in some browsers)
              alarmSound.currentTime = 0;
              alarmSound.play().catch(() => {
                console.warn('Autoplay was blocked by the browser.');
              });

              pauseButton.disabled = true;
              resetButton.disabled = false;
            } else {
              timeReadout.textContent = formatTime(remainingSeconds);
            }
          }
        }, 1000);
      }

      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          const seconds = parseInt(button.getAttribute('data-seconds'), 10);
          clearActiveButtons();
          button.classList.add('active');
          startTimer(seconds);
        });
      });

      pauseButton.addEventListener('click', () => {
        if (timerId === null) return;
        isPaused = !isPaused;
        if (isPaused) {
          statusText.textContent = 'Paused';
          pauseButton.textContent = 'Resume';
        } else {
          statusText.textContent = 'Timer running...';
          pauseButton.textContent = 'Pause';
        }
      });

      resetButton.addEventListener('click', () => {
        stopTimerInternal();
        resetVisuals();
        remainingSeconds = 0;
        timeReadout.textContent = '00:00';
        statusText.textContent = '';
        pauseButton.disabled = true;
        resetButton.disabled = true;
        clearActiveButtons();
      });

      // Initialize display
      timeReadout.textContent = '00:00';
      statusText.textContent = '';
    })();
  </script>
</body>
</html>
